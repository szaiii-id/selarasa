name: Backend CI (Testing)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  test-backend:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: selarasa_test_db
          POSTGRES_USER: selarasa_dev
          POSTGRES_PASSWORD: selarasa04!
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U selarasa_dev -d selarasa_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, bcmath, pdo_pgsql, curl, dom, fileinfo
          coverage: none

      - name: Install Composer Dependencies
        working-directory: ./backend
        run: composer update -q --no-ansi --no-interaction --no-progress --prefer-dist

      - name: Prepare Environment
        working-directory: ./backend
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run Migrations
        working-directory: ./backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: selarasa_test_db
          DB_USERNAME: selarasa_dev
          DB_PASSWORD: selarasa04!
        run: php artisan migrate --force

      - name: Execute Tests via Pest
        working-directory: ./backend
        env:
          DB_CONNECTION: pgsql
          DB_HOST: localhost
          DB_PORT: 5432
          DB_DATABASE: selarasa_test_db
          DB_USERNAME: selarasa_dev
          DB_PASSWORD: selarasa04!
        run: php artisan test