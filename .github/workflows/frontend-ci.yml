name: Frontend CI (Vue & Tests)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    name: CI - ${{ matrix.app }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [frontend-back-office, frontend-pos]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 1. SETUP BACKEND (VIA DOCKER COMPOSE)
      # ==========================================
      - name: Prepare & Start Backend Infrastructure
        run: |
          # 1. Buat file .env di root untuk memuaskan variabel di docker-compose.yml
          echo "PROJECT_NAME=selarasa_ci" >> .env
          echo "DB_NAME=testing_db" >> .env
          echo "DB_USER=testing_user" >> .env
          echo "DB_PASSWORD=secret" >> .env
          echo "REDIS_PASSWORD=secret" >> .env
          
          # 2. Siapkan .env.testing untuk backend Laravel
          cp ./backend/.env.example ./backend/.env.testing
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' ./backend/.env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=db/' ./backend/.env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' ./backend/.env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=testing_db/' ./backend/.env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=testing_user/' ./backend/.env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' ./backend/.env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=redis/' ./backend/.env.testing
          
          # Bebaskan CORS untuk pengujian E2E lokal di CI
          echo "APP_URL=http://127.0.0.1:8001" >> ./backend/.env.testing
          echo "FRONTEND_URL=http://127.0.0.1:5173,http://127.0.0.1:5174" >> ./backend/.env.testing
          echo "SANCTUM_STATEFUL_DOMAINS=127.0.0.1:5173,127.0.0.1:5174" >> ./backend/.env.testing
          echo "CORS_ALLOWED_ORIGINS=*" >> ./backend/.env.testing

          # 3. Bangun dan jalankan kontainer database, redis, dan backend_test di background
          docker compose up -d db redis backend_test
          
          # 4. Beri waktu agar PostgreSQL di dalam Docker benar-benar siap menerima koneksi
          echo "Menunggu database PostgreSQL siap..."
          sleep 15
          
          # 5. Jalankan setup database di dalam kontainer backend_test (-T untuk mematikan mode interaktif TTY di CI)
          docker compose exec -T backend_test php artisan key:generate --env=testing
          docker compose exec -T backend_test php artisan migrate --force --env=testing
          docker compose exec -T backend_test php artisan db:seed --force --env=testing

      # ==========================================
      # 2. SETUP FRONTEND (VUE)
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./${{ matrix.app }}
        run: npm install

      - name: Run Unit Tests (Vitest)
        working-directory: ./${{ matrix.app }}
        run: npx vitest run

      - name: Build Application
        working-directory: ./${{ matrix.app }}
        env:
          # Arahkan ke port 8001 (Port ini diekspos oleh backend_test di docker-compose)
          VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npm run build

      # ==========================================
      # 3. END-TO-END TESTING (PLAYWRIGHT)
      # ==========================================
      - name: Install Playwright Browsers
        working-directory: ./${{ matrix.app }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Playwright)
        working-directory: ./${{ matrix.app }}
        env:
          CI: true
          # Arahkan kembali ke backend Docker
          VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npx playwright test