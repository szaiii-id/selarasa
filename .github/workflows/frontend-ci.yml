name: Frontend CI (Vue & Tests)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    name: CI - ${{ matrix.app }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [frontend-back-office, frontend-pos]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 1. SETUP BACKEND (LARAVEL) UNTUK E2E TEST
      # ==========================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Sesuaikan dengan versi PHP backend Anda
          extensions: mbstring, xml, bcmath, sqlite3, pdo_sqlite
          tools: composer:v2

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Backend & Start Server
        working-directory: ./backend
        run: |
          cp .env.example .env
          
          # Paksa penggunaan SQLite dan sesuaikan APP_URL agar tidak kena blokir CORS
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i 's/APP_URL=.*/APP_URL=http:\/\/127.0.0.1:8001/' .env
          touch database/database.sqlite
          
          php artisan key:generate
          
          # 1. Jalankan Migrasi
          php artisan migrate --force
          
          # 2. ISI DATABASE (Seeding)! Ini kunci agar Playwright bisa login
          php artisan db:seed --force
          
          # 3. Jalankan server dengan host eksplisit
          php artisan serve --host=127.0.0.1 --port=8001 &
          
          # 4. Beri nafas 2 detik agar server Laravel benar-benar "On" sebelum lanjut
          sleep 2

      # ==========================================
      # 2. SETUP FRONTEND (VUE)
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./${{ matrix.app }}
        run: npm install

      - name: Run Unit Tests (Vitest)
        working-directory: ./${{ matrix.app }}
        run: npx vitest run

      - name: Build Application
        working-directory: ./${{ matrix.app }}
        env:
          # Arahkan ke server Laravel lokal yang menyala di background CI
          VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npm run build

      # ==========================================
      # 3. END-TO-END TESTING (PLAYWRIGHT)
      # ==========================================
      - name: Install Playwright Browsers
        working-directory: ./${{ matrix.app }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Playwright)
        working-directory: ./${{ matrix.app }}
        env:
          CI: true # Memberitahu playwright.config.ts bahwa ini di CI
          # Arahkan ke server Laravel lokal yang menyala di background CI
          VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npx playwright test