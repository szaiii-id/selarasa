name: Frontend CI (Vue & Tests)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    name: CI - ${{ matrix.app }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [frontend-back-office, frontend-pos]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 1. SETUP BACKEND (VIA DOCKER COMPOSE)
      # ==========================================
      - name: Prepare & Start Backend Infrastructure
        run: |
          # 1. Buat file .env di root
          echo "PROJECT_NAME=selarasa_ci" >> .env
          echo "DB_NAME=testing_db" >> .env
          echo "DB_USER=testing_user" >> .env
          echo "DB_PASSWORD=secret" >> .env
          echo "REDIS_PASSWORD=secret" >> .env
          
          # 2. Siapkan .env.testing
          cp ./backend/.env.example ./backend/.env.testing
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=pgsql/' ./backend/.env.testing
          sed -i 's/DB_HOST=.*/DB_HOST=db/' ./backend/.env.testing
          sed -i 's/DB_PORT=.*/DB_PORT=5432/' ./backend/.env.testing
          sed -i 's/DB_DATABASE=.*/DB_DATABASE=testing_db/' ./backend/.env.testing
          sed -i 's/DB_USERNAME=.*/DB_USERNAME=testing_user/' ./backend/.env.testing
          sed -i 's/DB_PASSWORD=.*/DB_PASSWORD=secret/' ./backend/.env.testing
          sed -i 's/REDIS_HOST=.*/REDIS_HOST=redis/' ./backend/.env.testing
          
          # Paksa Cache dan Session menggunakan 'file'
          sed -i '/^CACHE_STORE=/d' ./backend/.env.testing
          sed -i '/^CACHE_DRIVER=/d' ./backend/.env.testing
          sed -i '/^SESSION_DRIVER=/d' ./backend/.env.testing
          echo "CACHE_STORE=file" >> ./backend/.env.testing
          echo "CACHE_DRIVER=file" >> ./backend/.env.testing
          echo "SESSION_DRIVER=file" >> ./backend/.env.testing
          
          # [PERBAIKAN KRITIS 1] Konfigurasi Jaringan & Keamanan Sanctum
          echo "APP_URL=http://127.0.0.1:8001" >> ./backend/.env.testing
          echo "FRONTEND_URL=http://127.0.0.1:5173,http://127.0.0.1:5174" >> ./backend/.env.testing
          echo "SANCTUM_STATEFUL_DOMAINS=127.0.0.1:5173,127.0.0.1:5174" >> ./backend/.env.testing
          echo "SESSION_DOMAIN=127.0.0.1" >> ./backend/.env.testing
          
          # Hapus CORS lama, gunakan yang spesifik (Sanctum membenci '*')
          sed -i '/^CORS_ALLOWED_ORIGINS=/d' ./backend/.env.testing
          echo "CORS_ALLOWED_ORIGINS=http://127.0.0.1:5173,http://127.0.0.1:5174" >> ./backend/.env.testing

          # Paksa FrankenPHP mendengarkan lalu lintas dari luar kontainer
          echo "OCTANE_HOST=0.0.0.0" >> ./backend/.env.testing
          echo "SERVER_NAME=:8000" >> ./backend/.env.testing

          # 3. Nyalakan Database dan Redis lebih dulu
          docker compose up -d db redis
          
          # 4. Instal dependensi Composer
          docker compose run --rm --entrypoint="" backend_test composer update -q --no-ansi --no-interaction --no-progress --prefer-dist
          
          # 5. Nyalakan kontainer backend
          docker compose up -d backend_test
          
          echo "Menunggu kontainer stabil..."
          sleep 10
          
          # [PERBAIKAN KRITIS 2] Hapus Cache FrankenPHP agar .env terbaru terbaca
          docker compose exec -T backend_test php artisan config:clear --env=testing
          docker compose exec -T backend_test php artisan optimize:clear --env=testing
          
          # 6. Deteksi Log Jika Mati
          if ! docker compose exec -T backend_test echo "Backend is alive"; then
            echo "🚨 KONTAINER BACKEND MATI! Berikut log error-nya:"
            docker compose logs backend_test
            exit 1
          fi

          # 7. Setup Database Laravel
          docker compose exec -T backend_test php artisan key:generate --env=testing
          docker compose exec -T backend_test php artisan migrate --force --env=testing
          docker compose exec -T backend_test php artisan db:seed --force --env=testing

          # [PERBAIKAN KRITIS 3] Tes Koneksi sebelum Playwright membuang waktu
          echo "Menguji jaringan..."
          if ! curl -s http://127.0.0.1:8001 > /dev/null; then
            echo "🚨 PORT 8001 TIDAK MERESPONS DARI LUAR!"
            docker compose logs backend_test
            exit 1
          else
            echo "✅ Jaringan sukses! Backend siap diakses oleh Axios di Playwright."
          fi

      # ==========================================
      # 2. SETUP FRONTEND (VUE)
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./${{ matrix.app }}
        run: npm install

      - name: Run Unit Tests (Vitest)
        working-directory: ./${{ matrix.app }}
        run: npx vitest run

      - name: Build Application
        working-directory: ./${{ matrix.app }}
        env:
          # Arahkan ke port 8001 (Port ini diekspos oleh backend_test di docker-compose)
          VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npm run build

      # ==========================================
      # 3. END-TO-END TESTING (PLAYWRIGHT)
      # ==========================================
      - name: Install Playwright Browsers
        working-directory: ./${{ matrix.app }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Playwright)
        working-directory: ./${{ matrix.app }}
        env:
          CI: true
          # Arahkan kembali ke backend Docker
          VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npx playwright test