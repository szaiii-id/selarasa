name: Frontend CI (Vue & Tests)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    name: CI - ${{ matrix.app }}
    runs-on: ubuntu-latest
    
    # Matrix ini akan menjalankan job yang sama dua kali: 
    # satu untuk frontend-back-office, satu lagi untuk frontend-pos
    strategy:
      matrix:
        app: [frontend-back-office, frontend-pos]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20' 
          cache: 'npm'
          cache-dependency-path: ./${{ matrix.app }}/package-lock.json

      - name: Install Dependencies
        working-directory: ./${{ matrix.app }}
        run: npm install

      - name: Run Unit Tests (Vitest)
        working-directory: ./${{ matrix.app }}
        run: npx vitest run

      - name: Build Application
        working-directory: ./${{ matrix.app }}
        env:
          VITE_API_BASE_URL: http://selarasa:8000/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npm run build

      - name: Install Playwright Browsers
        working-directory: ./${{ matrix.app }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Playwright)
        working-directory: ./${{ matrix.app }}
        env:
          VITE_API_BASE_URL: http://selarasa:8000/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npx playwright test