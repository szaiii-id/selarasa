name: Frontend CI (Vue & Tests)

on:
  push:
    branches: [ "develop", "main" ]
  pull_request:
    branches: [ "develop", "main" ]

jobs:
  build-and-test:
    name: CI - ${{ matrix.app }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        app: [frontend-back-office, frontend-pos]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # ==========================================
      # 1. SETUP BACKEND (LARAVEL) UNTUK E2E TEST
      # ==========================================
      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3' # Sesuaikan dengan versi PHP backend Anda
          extensions: mbstring, xml, bcmath, sqlite3, pdo_sqlite
          tools: composer:v2

      - name: Install Backend Dependencies
        working-directory: ./backend
        run: composer update -q --no-ansi --no-interaction --no-scripts --no-progress --prefer-dist

      - name: Prepare Backend & Start Server
        working-directory: ./backend
        run: |
          cp .env.example .env
          
          # 1. Pastikan SQLite menggunakan jalur absolut agar tidak tersasar
          sed -i 's/DB_CONNECTION=.*/DB_CONNECTION=sqlite/' .env
          sed -i '/DB_DATABASE=/d' .env
          echo "DB_DATABASE=$PWD/database/database.sqlite" >> .env
          
          # 2. Bebaskan CORS secara paksa khusus untuk lingkungan CI
          echo "APP_URL=http://127.0.0.1:8001" >> .env
          echo "FRONTEND_URL=http://127.0.0.1:5173,http://127.0.0.1:5174" >> .env
          echo "SANCTUM_STATEFUL_DOMAINS=127.0.0.1:5173,127.0.0.1:5174" >> .env
          echo "CORS_ALLOWED_ORIGINS=*" >> .env
          
          # 3. Siapkan Database
          touch database/database.sqlite
          php artisan key:generate
          php artisan migrate --force
          php artisan db:seed --force
          
          # 4. Jalankan server dengan 'nohup' agar sistem CI tidak membunuhnya
          nohup php artisan serve --host=127.0.0.1 --port=8001 > laravel-server.log 2>&1 &
          
          # 5. Tunggu 3 detik, lalu tes denyut nadi server
          sleep 3
          echo "Menguji koneksi ke Backend..."
          if ! curl -s http://127.0.0.1:8001 > /dev/null; then
            echo "SERVER LARAVEL GAGAL MENYALA! Berikut adalah log error-nya:"
            cat laravel-server.log
            exit 1
          else
            echo "Server Laravel berhasil menyala dan siap menerima request!"
          fi

      # ==========================================
      # 2. SETUP FRONTEND (VUE)
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        working-directory: ./${{ matrix.app }}
        run: npm install

      - name: Run Unit Tests (Vitest)
        working-directory: ./${{ matrix.app }}
        run: npx vitest run

      - name: Build Application
        working-directory: ./${{ matrix.app }}
        env:
          # Arahkan ke server Laravel lokal yang menyala di background CI
          VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npm run build

      # ==========================================
      # 3. END-TO-END TESTING (PLAYWRIGHT)
      # ==========================================
      - name: Install Playwright Browsers
        working-directory: ./${{ matrix.app }}
        run: npx playwright install --with-deps chromium

      - name: Run E2E Tests (Playwright)
        working-directory: ./${{ matrix.app }}
        env:
          CI: true # Memberitahu playwright.config.ts bahwa ini di CI
          # Arahkan ke server Laravel lokal yang menyala di background CI
          VITE_API_BASE_URL: http://127.0.0.1:8001/api/v1
          VITE_APP_NAME: ${{ matrix.app == 'frontend-back-office' && 'SelaRasa Back Office' || 'SelaRasa POS' }}
        run: npx playwright test