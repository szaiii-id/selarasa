[databases]
selarasa_db = host=db port=5432 auth_user=selarasa_dev
selarasa_test_db = host=db port=5432 auth_user=selarasa_dev

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
max_client_conn = 100
default_pool_size = 10
admin_users = selarasa_dev